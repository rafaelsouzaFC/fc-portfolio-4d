<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfólio 4D | Ferreira Costa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style id="hub-css">:root{
  --paper:#EEF1F3;--panel:#FFFFFF;--panel2:#F5F7F8;--ink:#1C252D;--muted:#5C6974;--line:#D4DBE0;
  --red:#D7192A;--red-deep:#A8111F;--red-soft:#FBE6E8;--yellow:#F2C230;--orange:#E8862E;
  --st-uso:#3E9B68;--st-obra:#E8862E;--st-prov:#3B7FC4;--st-desat:#98A2AB;--st-entregue:#0F8C8C;
  --side:#1C252D;--side2:#252F38;--side3:#2E3944;--side-line:#36434E;--side-ink:#F1F4F6;--side-muted:#A3AFB9;
  --sw:312px;--rail:58px;
  --f:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --fc:"Barlow Condensed","Arial Narrow","Roboto Condensed",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#141A1F;--panel:#1C242B;--panel2:#222C34;--ink:#E7ECF0;--muted:#9AA7B2;--line:#2E3A44;--red-soft:#3A1D21;
    --side:#10161B;--side2:#18212A;--side3:#212C36;--side-line:#2A3640;
  }
}
:root[data-theme="dark"]{
  --paper:#141A1F;--panel:#1C242B;--panel2:#222C34;--ink:#E7ECF0;--muted:#9AA7B2;--line:#2E3A44;--red-soft:#3A1D21;
  --side:#10161B;--side2:#18212A;--side3:#212C36;--side-line:#2A3640;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--side)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:15px/1.45 var(--f);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
svg{width:18px;height:18px;flex:none}

#app{height:100%;display:grid;grid-template-columns:var(--sw) minmax(0,1fr);transition:grid-template-columns .22s ease}
#app.collapsed{grid-template-columns:var(--rail) minmax(0,1fr)}
#app.presenting{grid-template-columns:0 minmax(0,1fr)}

/* barra lateral */
.side{background:var(--side);color:var(--side-ink);overflow:hidden;min-width:0;display:flex;flex-direction:column;border-right:1px solid var(--side-line);position:relative;z-index:5}
#app.presenting .side{border-right:0}
.full{width:var(--sw);display:flex;flex-direction:column;height:100%;min-height:0}
.rail{width:var(--rail);display:none;flex-direction:column;align-items:center;gap:6px;padding:10px 0;height:100%;overflow-y:auto}
#app.collapsed .full{display:none}
#app.collapsed .rail{display:flex}

.brand{display:flex;align-items:center;gap:12px;padding:14px 12px 14px 16px;background:var(--red);color:#fff}
.brand .mk{flex:none;width:38px;height:38px;border-radius:9px;background:#fff;color:var(--red);display:grid;place-items:center;font:700 19px/1 var(--fc);letter-spacing:.02em}
.brand .bt{min-width:0;flex:1}
.brand h1{margin:0;font:600 23px/1.05 var(--fc);letter-spacing:.005em}
.brand p{margin:2px 0 0;font-size:12.5px;opacity:.86;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:8px;border:1px solid transparent;background:transparent;color:inherit;padding:0}
.ib:hover{background:rgba(255,255,255,.12)}
.brand .ib:hover{background:rgba(0,0,0,.14)}

.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.blk{padding:14px 16px;border-bottom:1px solid var(--side-line)}
.search{position:relative}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--side-muted);width:16px;height:16px}
.search input{width:100%;height:38px;border-radius:8px;border:1px solid var(--side-line);background:var(--side2);color:var(--side-ink);padding:0 10px 0 34px;font-size:14px}
.search input::placeholder{color:var(--side-muted)}
.search input:focus{border-color:var(--side-muted);outline:none}

.ftg{display:flex;align-items:center;gap:8px;width:100%;margin-top:12px;padding:6px 0;border:0;background:none;color:var(--side-ink);font:600 15px/1.2 var(--fc);letter-spacing:.02em;text-align:left}
.ftg svg{margin-left:auto;width:16px;height:16px;color:var(--side-muted);transition:transform .15s}
.ftg[aria-expanded="false"] svg{transform:rotate(-90deg)}
.ftg .fa{font:600 11.5px/1 var(--f);background:var(--red);color:#fff;padding:3px 7px;border-radius:9px}
.fb[hidden]{display:none}
.fg{margin-top:12px}
.fl{display:flex;align-items:baseline;justify-content:space-between;font:600 14px/1.2 var(--fc);letter-spacing:.02em;color:var(--side-muted);margin-bottom:7px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:3px 9px;border-radius:15px;border:1px solid var(--side-line);background:transparent;color:var(--side-ink);font-size:13px;line-height:1.2}
.chip:hover{border-color:var(--side-muted)}
.chip i{width:8px;height:8px;border-radius:50%;flex:none}
.chip .n{color:var(--side-muted);font-size:12px}
.chip[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.chip[aria-pressed="true"] .n{color:rgba(255,255,255,.8)}
.row2{display:flex;gap:8px;align-items:center;margin-top:14px}
.sel{flex:1;height:34px;border-radius:8px;border:1px solid var(--side-line);background:var(--side2);color:var(--side-ink);padding:0 8px;font-size:13.5px}
.tg{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13.5px;color:var(--side-ink);cursor:pointer}
.tg input{width:16px;height:16px;accent-color:var(--red);margin:0}
.clear{margin-top:12px;background:none;border:0;color:var(--side-muted);font-size:13px;padding:0;text-decoration:underline;text-underline-offset:3px}
.clear:hover{color:var(--side-ink)}

.nav{padding:10px 8px}
.ov{display:flex;align-items:center;gap:10px;width:100%;min-height:42px;padding:8px 10px;border-radius:8px;border:0;background:transparent;color:var(--side-ink);text-align:left;font-weight:500}
.ov:hover{background:var(--side2)}
.ov[aria-current="true"]{background:var(--side3);box-shadow:inset 3px 0 0 var(--red)}
.ov .c{margin-left:auto;font-size:12.5px;color:var(--side-muted)}
.lh{display:flex;justify-content:space-between;align-items:baseline;padding:12px 18px 6px;font:600 14px/1.2 var(--fc);letter-spacing:.02em;color:var(--side-muted)}
.list{padding:0 8px 16px;display:flex;flex-direction:column;gap:2px}
.pj{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;width:100%;padding:10px 10px 11px;border-radius:8px;border:0;background:transparent;color:var(--side-ink);text-align:left}
.pj:hover{background:var(--side2)}
.pj[aria-current="true"]{background:var(--side3);box-shadow:inset 3px 0 0 var(--red)}
.pj .no{font:600 17px/1.2 var(--fc);color:var(--side-muted);padding-top:1px}
.pj[aria-current="true"] .no{color:var(--red)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pj[aria-current="true"] .no{color:#FF5A66}}
.pj b{display:block;font-weight:600;font-size:14.5px;line-height:1.25}
.pj .ar{display:block;font-size:12.5px;color:var(--side-muted);margin-top:2px}
.pj .mt{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:7px;font-size:12px;color:var(--side-muted)}
.pj .mt span{display:inline-flex;align-items:center;gap:5px}
.pj .mt i{width:7px;height:7px;border-radius:50%}
.pj .mt .op{color:var(--yellow)}
.none{padding:10px 18px;font-size:13.5px;color:var(--side-muted)}

.foot{padding:10px 16px;border-top:1px solid var(--side-line);font-size:12px;color:var(--side-muted)}

/* trilho recolhido */
.rail .mk{width:38px;height:38px;border-radius:9px;background:var(--red);color:#fff;display:grid;place-items:center;font:700 18px/1 var(--fc);margin-bottom:4px}
.rail .sep{width:28px;height:1px;background:var(--side-line);margin:4px 0}
.rb{position:relative;width:42px;height:42px;border-radius:9px;border:0;background:transparent;color:var(--side-ink);display:grid;place-items:center;font:600 16px/1 var(--fc);padding:0}
.rb:hover{background:var(--side2)}
.rb[aria-current="true"]{background:var(--side3);box-shadow:inset 3px 0 0 var(--red)}
.rb i{position:absolute;right:6px;top:6px;width:7px;height:7px;border-radius:50%}

/* área principal */
.main{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--paper)}
.stage{position:absolute;inset:0}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:var(--paper);visibility:hidden;pointer-events:none}
.stage iframe.on{visibility:visible;pointer-events:auto}
.loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--paper);color:var(--muted);font-size:14px;z-index:2}
.loading[hidden]{display:none}
.loading div{display:flex;flex-direction:column;align-items:center;gap:12px}
.loading b{font:600 20px/1.2 var(--fc);color:var(--ink)}
.bar{width:160px;height:3px;border-radius:2px;background:var(--line);overflow:hidden;position:relative}
.bar::after{content:"";position:absolute;inset:0 60% 0 0;background:var(--red);animation:ld 1.1s ease-in-out infinite}
@keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
@media (prefers-reduced-motion:reduce){#app{transition:none}.bar::after{animation:none;inset:0}}

/* visão geral */
.over{position:absolute;inset:0;overflow-y:auto;z-index:3;background:var(--paper)}
.over[hidden]{display:none}
.wrap{max-width:1180px;margin:0 auto;padding:30px 32px 56px}
.oh{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:20px;border-bottom:3px solid var(--red)}
.oh h2{margin:0;font:600 38px/1 var(--fc);letter-spacing:-.003em}
.oh p{margin:6px 0 0;color:var(--muted);font-size:14.5px}
.flt{font-size:13px;color:var(--muted);max-width:52ch;text-align:right}
.flt b{color:var(--ink);font-weight:600}

.kp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-top:22px;overflow:hidden}
.kp div{padding:16px 18px;border-left:1px solid var(--line)}
.kp div:first-child{border-left:0}
.kp strong{display:block;font:600 34px/1 var(--fc)}
.kp span{display:block;margin-top:6px;font-size:13px;color:var(--muted)}
.kp .hot strong{color:var(--red)}

.sec{margin-top:34px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sh h3{margin:0;font:600 24px/1.1 var(--fc)}
.sh .tg2{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);cursor:pointer}
.sh .tg2 input{accent-color:var(--red);width:16px;height:16px;margin:0}

.tw{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th{white-space:nowrap;font:600 14px/1.2 var(--fc);letter-spacing:.02em;color:var(--muted);text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--panel2)}
th.r,td.r{text-align:right}
td{padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:14px}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--panel2)}
td .tt{font-weight:600;font-size:15px}
td .aa{color:var(--muted);font-size:12.5px;margin-top:2px}
.pl{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.pl i{width:9px;height:9px;border-radius:50%}
.num{font:600 19px/1 var(--fc)}
.num.op{color:var(--red)}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:5px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font-weight:500;font-size:13.5px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pr{background:var(--red);border-color:var(--red);color:#fff}
.btn.pr:hover{background:var(--red-deep);border-color:var(--red-deep)}
.btn svg{width:15px;height:15px}

.grp{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-top:12px;overflow:hidden}
.gh{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel2)}
.gh .no{font:600 18px/1 var(--fc);color:var(--red)}
.gh b{font-weight:600;font-size:15px}
.gh .ct{font-size:13px;color:var(--muted)}
.gh .btn{margin-left:auto}
.dl{list-style:none;margin:0;padding:0}
.dl li{display:grid;grid-template-columns:132px minmax(0,1fr) auto;gap:14px;align-items:start;padding:12px 16px;border-top:1px solid var(--line)}
.dl li:first-child{border-top:0}
.dl .cd{font:600 14px/1.25 var(--fc);color:var(--muted)}
.dl .cd small{display:block;font:400 12px/1.3 var(--f);margin-top:2px}
.dl .tx{font-size:14px;line-height:1.45;max-width:78ch}
.dl .tx .st{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:9px;margin-right:6px;background:var(--red-soft);color:var(--red);vertical-align:1px}
.dl li.ok .tx .st{background:transparent;border:1px solid var(--st-uso);color:var(--st-uso)}
.dl li.ok .tx{color:var(--muted)}
.dl .an{margin-top:4px;font-size:13px;color:var(--ink)}
.dl .go{min-height:30px;font-size:13px;padding:3px 10px}
.more{display:block;width:100%;padding:10px 16px;border:0;border-top:1px solid var(--line);background:transparent;color:var(--muted);font-size:13.5px;text-align:left}
.more:hover{color:var(--ink);background:var(--panel2)}
.empty{padding:28px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:10px}
.empty .btn{margin-top:10px}
.note{margin-top:28px;font-size:12.5px;color:var(--muted)}

.scrim{display:none}
@media (max-width:900px){
  .wrap{padding:22px 18px 40px}
  .kp{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kp div:nth-child(3){border-left:0}
  .kp div:nth-child(n+3){border-top:1px solid var(--line)}
  .oh h2{font-size:32px}
  .flt{text-align:left}
  .dl li{grid-template-columns:minmax(0,1fr);gap:6px}
}
@media (max-width:760px){
  #app,#app.collapsed{grid-template-columns:var(--rail) minmax(0,1fr)}
  #app:not(.collapsed) .side{position:fixed;left:0;top:0;bottom:0;width:min(var(--sw),88vw);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  #app:not(.collapsed) .full{width:100%}
  #app:not(.collapsed) .main{grid-column:2}
  #app:not(.collapsed) .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:4;border:0;padding:0}
}

/* impressão A3 do passo */
.pv{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:rgba(20,26,31,.78);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.pv[hidden]{display:none}
.pv-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 18px;background:var(--panel);border-bottom:3px solid var(--red)}
.pv-bar .t{min-width:0;flex:1}
.pv-bar b{display:block;font:600 20px/1.1 var(--fc)}
.pv-bar small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.pv-bar .btn{min-height:40px;font-size:14px;padding:6px 14px}
.pv-stage{flex:1;min-height:0;display:grid;place-items:center;overflow:auto;padding:18px}
.pv-scale{position:relative;box-shadow:0 10px 40px rgba(0,0,0,.45);background:#fff}
.pv-msg{color:#fff;font-size:14px}
.pv-busy{opacity:.6;pointer-events:none}
#pvHold{position:fixed;left:-30000px;top:0;pointer-events:none}

.a3{width:1587px;height:1122px;overflow:hidden;background:#fff;color:#1C252D;font:15px/1.4 "Barlow",Arial,sans-serif;padding:40px 46px 34px;display:flex;flex-direction:column;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.a3 *{box-sizing:border-box}
.a3-h{display:flex;align-items:center;gap:18px;padding-bottom:16px;border-bottom:4px solid #D7192A}
.a3-mk{width:58px;height:58px;border-radius:12px;background:#D7192A;color:#fff;display:grid;place-items:center;font:700 28px/1 "Barlow Condensed",Arial,sans-serif;flex:none}
.a3-tt{min-width:0;flex:1}
.a3-tt h1{margin:0;font:600 36px/1.05 "Barlow Condensed",Arial,sans-serif}
.a3-tt p{margin:4px 0 0;font-size:14px;color:#5C6974}
.a3-st{text-align:right;flex:none}
.a3-st .c{font:700 30px/1 "Barlow Condensed",Arial,sans-serif;color:#D7192A}
.a3-st .d{font-size:14px;color:#5C6974;margin-top:5px}
.a3-b{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 452px;gap:26px;padding-top:20px}
.a3-v{display:flex;flex-direction:column;min-height:0}
.a3-img{flex:1;min-height:0;border:1px solid #D4DBE0;border-radius:10px;overflow:hidden;background:#DCE3E8;display:grid;place-items:center}
.a3-img img{width:100%;height:100%;object-fit:contain;display:block}
.a3-img .none{color:#5C6974;font-size:15px}
.a3-lg{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:13px;color:#3A4650}
.a3-lg span{display:inline-flex;align-items:center;gap:6px}
.a3-lg i{width:12px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.15)}
.a3-lg i.o{border-radius:50%}
.a3-lg .sep{width:1px;height:14px;background:#D4DBE0}
.a3-p{min-height:0;overflow:hidden;border-left:1px solid #D4DBE0;padding-left:24px;font-size:var(--fz,15px)}
.a3-p .k{font:700 1.2em/1.1 "Barlow Condensed",Arial,sans-serif;color:#D7192A}
.a3-p h2{margin:4px 0 8px;font:600 2em/1.08 "Barlow Condensed",Arial,sans-serif}
.a3-p .ds{margin:0 0 6px;color:#2B3640}
.a3-p h3{margin:16px 0 7px;font:600 1.06em/1.2 "Barlow Condensed",Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#5C6974}
.a3-p ol,.a3-p ul{list-style:none;margin:0;padding:0}
.a3-p .it{display:grid;grid-template-columns:1.7em minmax(0,1fr);gap:8px;margin-bottom:7px}
.a3-p .n{width:1.6em;height:1.6em;border-radius:50%;background:#D7192A;color:#fff;display:grid;place-items:center;font:700 .86em/1 "Barlow Condensed",Arial,sans-serif}
.a3-p .n.dot{background:#5C6974}
.a3-p .zn{display:flex;gap:8px;align-items:baseline;margin-bottom:4px}
.a3-p .zn i{width:.68em;height:.68em;border-radius:50%;flex:none;transform:translateY(-.05em)}
.a3-p .zn b{font-weight:600}
.a3-p .zn span{color:#5C6974}
.a3-p .dc{border-left:3px solid #F2C230;background:#FBF6E4;padding:6px 10px;margin-bottom:6px;border-radius:0 6px 6px 0}
.a3-p .dc.ok{border-left-color:#3E9B68;background:#EEF6F1}
.a3-p .dc small{display:block;font-size:.8em;font-weight:600;color:#7A6514}
.a3-p .dc.ok small{color:#2F7A50}
.a3-p .none{color:#5C6974}
.a3-p .sc+.sc{margin-top:4px}
.a3.wide .a3-b{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:16px}
.a3.wide .a3-p{border-left:0;padding-left:0;border-top:1px solid #D4DBE0;padding-top:14px;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:28px}
.a3.wide .a3-p .sc{min-height:0;overflow:hidden;margin-top:0}
.a3.wide .a3-p .sc+.sc{border-left:1px solid #D4DBE0;padding-left:24px}
.a3.wide .a3-p .sc:first-child{grid-column:span 1}

font:600 13px/1.2 var(--f);box-shadow:0 1px 2px rgba(0,0,0,.1);pointer-events:none;max-width:calc(100% - 24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\nbody.compare .cmp-top{top:54px}\nbody.compare .cmp-bot{top:calc(50% + 10px);color:var(--red)}\nbody.compare .caption{display:none!important}\n@media (max-width:1100px){body.compare .cmp-top{top:auto;bottom:calc(50% + 10px);max-width:calc(100% - 24px)}}\n\n/* coluna central: vista + navegação */\n.center{display:flex;flex-direction:column;min-width:0;min-height:0}\n.center .view{flex:1 1 auto}\n.caption{display:none!important}\n/* cartão do passo */\n.info{position:absolute;left:12px;top:12px;z-index:3;width:360px;max-width:calc(100% - 24px);max-height:calc(100% - 24px);display:flex;flex-direction:column;background:var(--panel);border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.12),0 0 0 1px rgba(0,0,0,.04);padding:14px 16px 4px}\n.info .i-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}\n.info .i-min{flex:none;border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:6px;font:500 12.5px/1 var(--f);padding:5px 8px;cursor:pointer}\n.info .i-min:hover{color:var(--ink)}\n.info h2{margin:6px 0 10px;font:600 24px/1.1 var(--fc);letter-spacing:.005em}\n.info .i-body{overflow:auto;min-height:0;padding-bottom:12px;margin-right:-8px;padding-right:8px}\n.info.min{padding-bottom:4px}\n.info.min .i-body{display:none}\n.info .d-desc{font-size:14px;line-height:1.45;margin:0 0 4px}\n.info h3{margin:14px 0 8px;font:600 12.5px/1.2 var(--f);color:var(--muted);letter-spacing:.03em;text-transform:uppercase}\n.info .scope{gap:6px;font-size:14px;line-height:1.35}\n.info .scope li{grid-template-columns:24px 1fr;gap:8px}\n.info .scope li .n{width:22px;height:22px;font-size:12px}\n.uso2{display:grid;gap:5px;font-size:13.5px}\n.u-row{display:grid;grid-template-columns:10px auto 1fr;align-items:baseline;gap:4px 8px}\n.u-row i{width:9px;height:9px;border-radius:50%;align-self:center}\n.u-row b{font-weight:600}\n.u-row span{color:var(--muted);font-size:12.5px}\n.info .decs{gap:6px;font-size:13.5px}\n.info .decs li{padding:7px 10px}\n.vtools{max-width:calc(100% - 400px)}\n.legend{max-width:calc(100% - 400px)}\nbody.compare .cmp-badge{left:auto;right:12px}\n/* barra de navegação do passo a passo */\n.stepnav{display:flex;align-items:center;gap:14px;padding:10px 14px;background:var(--panel);border-top:1px solid var(--line)}\n.stepnav .nav-b{flex:none;display:inline-flex;align-items:center;gap:6px;min-width:120px;justify-content:center;padding:9px 14px;font-weight:600}\n.stepnav .nav-b svg{width:16px;height:16px}\n.stepnav .nav-b:disabled{opacity:.4;cursor:default}\n.nav-mid{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px}\n.nav-t{display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:4px 12px;font-size:13.5px;color:var(--muted)}\n.nav-t b{font:700 16px/1.1 var(--fc);color:var(--red);letter-spacing:.02em}\n.nav-dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}\n.nav-dots .nd{width:26px;height:6px;border-radius:3px;border:0;padding:0;background:var(--line);cursor:pointer}\n.nav-dots .nd.done{background:var(--st-entregue);opacity:.6}\n.nav-dots .nd.cur{background:var(--red);width:40px}\n@media (max-width:1100px){\n  .info{width:310px;max-height:52%}\n  .info h2{font-size:20px}\n  .vtools,.legend{max-width:calc(100% - 24px)}\n}\n@media (max-width:640px){.stepnav .nav-b{min-width:0}.stepnav .nav-b span{display:none}.nav-c{display:none}}\n\n/* camadas de projeto */\n.layerbar{position:absolute;right:12px;top:54px;z-index:2;display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:6px;max-width:calc(100% - 400px)}\n.layerbar .lb-t{font:600 12px/1 var(--f);color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-right:2px;background:var(--panel);padding:6px 8px;border-radius:6px}\n.layerbar .lb-sep{width:1px;height:22px;background:var(--line);margin:0 2px}\n.lchip[aria-pressed=\"true\"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}\n.layerleg{position:absolute;right:12px;bottom:64px;z-index:2;width:300px;max-height:calc(100% - 180px);overflow:auto;background:var(--panel);border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.12);padding:10px 12px;display:grid;gap:10px;font-size:12.5px;line-height:1.35}\n.layerleg[hidden]{display:none}\n.ll-h{font-weight:700;font-size:13px;display:flex;flex-direction:column;gap:1px;margin-bottom:4px}\n.ll-h span{font-weight:400;color:var(--muted);font-size:11.5px}\n.ll-r{display:grid;grid-template-columns:16px 1fr;gap:6px;align-items:center;margin:2px 0}\n.ll-r i{width:12px;height:12px;display:block;border:1px solid rgba(0,0,0,.25)}\n.ll-r i.k-dot,.ll-r i.k-disc{border-radius:50%}\n.ll-r i.k-line{height:3px;border:0}\n.ll-n{color:var(--muted);font-size:11.5px;margin-top:3px}\nbody.no-tags .tag,body.no-tags .pin{display:none!important}\nbody.compare .cmp-top{top:96px}\n@media (max-width:1100px){.layerbar{max-width:calc(100% - 24px);top:auto;bottom:64px;left:12px;right:12px;justify-content:flex-start}.layerleg{bottom:110px;width:260px}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv id=\"root\">\u003c/div>\n\u003cscript id=\"plan-data\" type=\"application/json\">{\"rev\":4,\"project\":{\"title\":\"Reforma dos sanitários do mezanino\",\"subtitle\":\"Novo Corporativo Ferreira Costa, projeto executivo R03 com pranchas de etapas 01 a 08 revisadas, datas do cronograma de 01/10/2026 a revisar\",\"key\":\"fc-mezanino-r03-etapas8\",\"mark\":\"FC\"},\"steps\":[{\"id\":\"s0\",\"code\":\"Antes da obra\",\"title\":\"Situação atual do mezanino\",\"start\":\"2026-10-12\",\"end\":\"2026-10-12\",\"days\":0,\"desc\":\"Situação atual: Reunião 8 e Reunião 7 em uso; WC feminino com 2 lavatórios e 2 boxes; hall de acesso com o DML; WC masculino com 2 boxes, 2 lavatórios e 2 mictórios.\",\"items\":[],\"zones\":{\"sala\":{\"label\":\"Reunião 8\",\"status\":\"uso\",\"who\":\"\"},\"strip\":{\"label\":\"\",\"status\":\"uso\",\"who\":\"\"},\"prov\":{\"label\":\"Reunião 7\",\"status\":\"uso\",\"who\":\"\"},\"fem\":{\"label\":\"WC feminino\",\"status\":\"uso\",\"who\":\"Mulheres\"},\"dml\":{\"label\":\"Hall e DML\",\"status\":\"uso\",\"who\":\"\"},\"masc\":{\"label\":\"WC masculino\",\"status\":\"uso\",\"who\":\"Homens\"},\"corr\":{\"label\":\"Circulação\",\"status\":\"uso\",\"who\":\"\"}},\"els\":{},\"decisions\":[]},{\"id\":\"e1\",\"code\":\"Etapa 01\",\"title\":\"Remoção e armazenamento do mobiliário\",\"start\":\"2026-10-13\",\"end\":\"2026-10-13\",\"days\":1,\"desc\":\"As salas 7 e 8 são esvaziadas: o mobiliário, os armários em frente às salas e os splits são retirados e armazenados, e a área é isolada para o início sequencial das atividades.\",\"items\":[{\"n\":\"1\",\"t\":\"Remoção e armazenamento do mobiliário existente nas salas 7 e 8, incluindo os armários localizados em frente às salas\",\"z\":\"sala\"},{\"n\":\"2\",\"t\":\"Isolamento da área para permitir o início sequencial das atividades previstas no projeto\",\"z\":\"corr\"}],\"zones\":{\"sala\":{\"label\":\"Reunião 8\",\"status\":\"desat\",\"who\":\"Mobiliário retirado\"},\"strip\":{\"label\":\"\",\"status\":\"desat\",\"who\":\"\"},\"prov\":{\"label\":\"Reunião 7\",\"status\":\"desat\",\"who\":\"Mobiliário retirado\"},\"corr\":{\"label\":\"Circulação\",\"status\":\"uso\",\"who\":\"Tapume em frente às salas\"}},\"els\":{\"mob_old\":\"demolir\",\"split_old\":\"demolir\",\"tap_salas\":\"novo\"},\"decisions\":[{\"t\":\"Os armários em frente às salas ficam fora do recorte das pranchas e não estão no modelo nesta etapa. Onde serão armazenados?\",\"st\":\"aberto\",\"a\":\"\"},{\"t\":\"A retirada dos splits não aparece nas pranchas de etapas. Mantida conforme o R03 e o cronograma de 01/10 (retirada aqui, reinstalação na nova sala na Etapa 03). Confirmar.\",\"st\":\"aberto\",\"a\":\"\"}],\"focus\":[-0.3,7.6]},{\"id\":\"e2\",\"code\":\"Etapa 02\",\"title\":\"Adequação das divisórias e criação de novos ambientes\",\"start\":\"2026-10-14\",\"end\":\"2026-10-21\",\"days\":5,\"desc\":\"A parede entre as salas sai e uma nova parede em drywall é construída a 3,90 m da parede lateral, deixando 3,39 m para o banheiro provisório. A frente do provisório na circulação é fechada com parede nova e a porta de divisória é relocada para a nova sala 8.\",\"items\":[{\"n\":\"1\",\"t\":\"Execução de uma nova parede, com avanço de 3,40 m para o interior da antiga sala 7, a fim de delimitar o banheiro provisório, contemplando a instalação de uma porta de acesso voltada para a área externa do salão do open office\",\"z\":\"strip\"},{\"n\":\"2\",\"t\":\"Em paralelo, será realizada a demolição da parede existente no fundo da sala 7, possibilitando a reconfiguração do espaço e a implantação da nova sala 8\",\"z\":\"sala\"}],\"zones\":{\"sala\":{\"label\":\"Nova sala 8\",\"status\":\"obra\",\"who\":\"\"},\"strip\":{\"label\":\"\",\"status\":\"obra\",\"who\":\"\"},\"prov\":{\"label\":\"Novo ambiente (WC provisório)\",\"status\":\"obra\",\"who\":\"\"}},\"els\":{\"p245\":\"demolir\",\"div_s7\":\"demolir\",\"porta_s7\":\"demolir\",\"porta_s8\":\"demolir\",\"div_nova\":\"novo\",\"porta_sala\":\"novo\",\"dw390\":\"novo\",\"dw_topo\":\"novo\",\"porta_reap\":\"novo\"},\"decisions\":[{\"t\":\"O texto fala em avanço de 3,40 m e o desenho cota 3,39 m entre o drywall novo e a parede do WC feminino. Modelado pelo desenho.\",\"st\":\"aberto\",\"a\":\"\"}],\"focus\":[-0.3,7.6]},{\"id\":\"e3\",\"code\":\"Etapa 03\",\"title\":\"Instalação do mobiliário e montagem do banheiro provisório\",\"start\":\"2026-10-14\",\"end\":\"2026-10-31\",\"days\":14,\"desc\":\"A mesa da antiga sala 7 é montada na nova sala 8. No novo ambiente entram 02 cubas temporárias e 02 cabines sanitárias com divisórias novas e drywall de separação. Os homens passam a usar o WC do térreo.\",\"items\":[{\"n\":\"1\",\"t\":\"Realocação e instalação do mobiliário da antiga sala 7 na nova sala 8, conforme o layout previsto para o ambiente\",\"z\":\"sala\"},{\"n\":\"2\",\"t\":\"Instalar 02 lavatórios provisórios e 02 cabines sanitárias provisórias para uso durante a reforma. E orientar os homens a utilizarem o banheiro do pavimento térreo para que a reforma dos WCs possa iniciar\",\"z\":\"prov\"}],\"zones\":{\"sala\":{\"label\":\"Nova sala de reunião 8\",\"status\":\"entregue\",\"who\":\"Liberada em 21/10\"},\"strip\":{\"label\":\"\",\"status\":\"prov\",\"who\":\"Acesso ao provisório\"},\"prov\":{\"label\":\"WC provisório\",\"status\":\"prov\",\"who\":\"Pronto em 31/10\"},\"masc\":{\"label\":\"WC masculino\",\"status\":\"desat\",\"who\":\"Homens vão ao WC do térreo\"},\"corr\":{\"label\":\"Circulação\",\"status\":\"uso\",\"who\":\"\"}},\"els\":{\"mob_new\":\"novo\",\"split_new\":\"novo\",\"alv529\":\"novo\",\"cab_prov\":\"novo\",\"fx_prov\":\"novo\",\"tap_salas\":\"oculto\"},\"decisions\":[{\"t\":\"O provisório agora tem 02 lavatórios e 02 cabines, sem mictórios (o R03 previa 03 lavatórios, 02 cabines e 02 mictórios). Atende o efetivo feminino do mezanino?\",\"st\":\"aberto\",\"a\":\"\"},{\"t\":\"Os homens usam o WC do térreo da Etapa 03 até a Etapa 07. Comunicado e sinalização definidos com a Administração?\",\"st\":\"aberto\",\"a\":\"\"},{\"t\":\"Na prancha, as dobradiças das divisórias do WC masculino estão em amarelo, mas o texto não cita reaproveitamento no provisório. As divisórias do provisório são novas ou reaproveitadas?\",\"st\":\"aberto\",\"a\":\"\"},{\"t\":\"Acessibilidade do WC provisório validada?\",\"st\":\"aberto\",\"a\":\"\"}],\"focus\":[-0.3,7.6]},{\"id\":\"e4\",\"code\":\"Etapa 04\",\"title\":\"Isolamento da área e início das intervenções nos banheiros\",\"start\":\"2026-10-31\",\"end\":\"2026-11-10\",\"days\":6,\"desc\":\"Tapumes laterais e a nova alvenaria de 2,70 m fecham a frente dos WCs. A porta atual do WC feminino sai e o vão é fechado, abre-se o vão de 1,00 m da nova entrada feminina, e saem o DML, as paredes do hall, as portas e todas as peças dos dois WCs. As mulheres passam ao WC provisório.\",\"items\":[{\"n\":\"1\",\"t\":\"Isolamento da área: instalação de tapume para isolamento e proteção da área de intervenção, garantindo a segregação do ambiente durante a execução dos serviços\",\"z\":\"corr\"},{\"n\":\"2\",\"t\":\"Início da demolição das estruturas internas dos banheiros, restrita aos elementos necessários para a adequação dos ambientes, seguida da execução da alvenaria externa para separação e definição dos acessos aos banheiros\",\"z\":\"dml\"}],\"zones\":{\"prov\":{\"label\":\"WC provisório\",\"status\":\"prov\",\"who\":\"Mulheres\"},\"strip\":{\"label\":\"\",\"status\":\"prov\",\"who\":\"Acesso ao provisório\"},\"fem\":{\"label\":\"WC feminino\",\"status\":\"obra\",\"who\":\"Demolição\"},\"dml\":{\"label\":\"Hall e DML\",\"status\":\"obra\",\"who\":\"Demolição\"},\"masc\":{\"label\":\"WC masculino\",\"status\":\"obra\",\"who\":\"Demolição\"},\"corr\":{\"label\":\"Circulação\",\"status\":\"uso\",\"who\":\"Tapume e alvenaria em frente aos WCs\"}},\"els\":{\"tap_wcs\":\"novo\",\"barreira\":\"novo\",\"compl\":\"novo\",\"fech_fem\":\"novo\",\"ab_fem\":\"demolir\",\"porta_fem\":\"demolir\",\"fx_fem_old\":\"demolir\",\"p_dml\":\"demolir\",\"porta_dml\":\"demolir\",\"p1217\":\"demolir\",\"porta_masc\":\"demolir\",\"div_masc_old\":\"demolir\",\"fx_masc_old\":\"demolir\",\"fx_dml_old\":\"demolir\"},\"decisions\":[{\"t\":\"O texto não diz quem usa o provisório a partir daqui. Pela sequência, os dois WCs ficam em obra e as mulheres passam ao provisório. Confirmar.\",\"st\":\"aberto\",\"a\":\"\"},{\"t\":\"As pranchas revisadas fazem a demolição do WC feminino junto com a do masculino. O cronograma de 01/10 previa essa demolição só em 28/11 a 04/12. Revisar o cronograma.\",\"st\":\"aberto\",\"a\":\"\"}],\"focus\":[7.2,15.6]},{\"id\":\"e5\",\"code\":\"Etapa 05\",\"title\":\"Execução dos acabamentos e instalação dos equipamentos sanitários\",\"start\":\"2026-11-07\",\"end\":\"2026-11-27\",\"days\":15,\"desc\":\"Impermeabilização, instalações e revestimentos. O WC masculino recebe o novo layout: 3 cabines, bancada com 4 cubas e 4 mictórios, ocupando a área do antigo DML. No feminino entram as cabines 3, 4 e 5, que ficam isoladas. Os tapumes da circulação saem e as soleiras são assentadas.\",\"items\":[{\"n\":\"1\",\"t\":\"Execução dos serviços internos de: impermeabilização, execução das instalações elétricas e hidráulicas e assentamento de revestimentos\",\"z\":\"masc\"},{\"n\":\"2\",\"t\":\"Instalação das bancadas, divisórias, louças e metais sanitários do banheiro masculino e do trecho correspondente ao banheiro feminino que permanecerá isolado durante esta fase\",\"z\":\"fem\"}],\"zones\":{\"dml\":{\"label\":\"Ampliação do WC masculino\",\"status\":\"obra\",\"who\":\"\"},\"masc\":{\"label\":\"WC masculino (novo layout)\",\"status\":\"obra\",\"who\":\"\"},\"fem\":{\"label\":\"WC feminino\",\"status\":\"obra\",\"who\":\"Cabines 3 a 5, isolado\"},\"corr\":{\"label\":\"Circulação\",\"status\":\"uso\",\"who\":\"Soleiras nas novas entradas\"}},\"els\":{\"tap_wcs\":\"oculto\",\"fx_masc_new\":\"novo\",\"fx_fem_cab\":\"novo\"},\"decisions\":[{\"t\":\"As Etapas 04 e 05 se sobrepõem a partir de 07/11 no cronograma de 01/10. Frentes simultâneas confirmadas com a contratada?\",\"st\":\"aberto\",\"a\":\"\"},{\"t\":\"Com os tapumes retirados, o que isola o WC feminino em obra até a Etapa 07?\",\"st\":\"aberto\",\"a\":\"\"}],\"focus\":[7.2,15.6]},{\"id\":\"e6\",\"code\":\"Etapa 06\",\"title\":\"Desmobilização do banheiro provisório e ampliação do banheiro feminino\",\"start\":\"2026-12-04\",\"end\":\"2026-12-17\",\"days\":11,\"desc\":\"Com o WC masculino liberado, as colaboradoras passam a usá-lo e o provisório é desmontado: saem as cubas temporárias, o trecho de drywall é fechado para o novo DML e o trecho da parede de alvenaria é demolido para ampliar o WC feminino. As cabines 1 e 2 do provisório ficam no layout final.\",\"items\":[{\"n\":\"1\",\"t\":\"Após a conclusão dos serviços e a liberação do novo banheiro masculino, será realizada a desmobilização do banheiro provisório, com direcionamento das colaboradoras para utilização do banheiro masculino recém-finalizado\",\"z\":\"masc\"},{\"n\":\"2\",\"t\":\"Fechamento do trecho do banheiro provisório destinado à implantação do Depósito de Material de Limpeza (DML), seguido da demolição de parte da parede existente para viabilizar a ampliação da área do novo banheiro feminino, conforme o projeto\",\"z\":\"strip\"}],\"zones\":{\"dml\":{\"label\":\"\",\"status\":\"entregue\",\"who\":\"\"},\"masc\":{\"label\":\"WC masculino\",\"status\":\"entregue\",\"who\":\"Uso das colaboradoras\"},\"strip\":{\"label\":\"Novo DML\",\"status\":\"obra\",\"who\":\"\"},\"prov\":{\"label\":\"Ampliação do WC feminino\",\"status\":\"obra\",\"who\":\"\"},\"fem\":{\"label\":\"WC feminino\",\"status\":\"obra\",\"who\":\"\"}},\"els\":{\"fx_prov\":\"demolir\",\"fech_prov\":\"novo\",\"p738t\":\"demolir\"},\"decisions\":[{\"t\":\"Das Etapas 06 a 07 o WC masculino novo atende só as colaboradoras e os homens seguem no térreo. Sinalização da troca definida?\",\"st\":\"aberto\",\"a\":\"\"},{\"t\":\"O cronograma de 01/10 tem uma única janela de 04/12 a 17/12 para as Etapas 06 e 07. Definir a divisão de datas.\",\"st\":\"aberto\",\"a\":\"\"},{\"t\":\"O cronograma de 01/10 deixa 28/11 a 04/12 para a reforma do WC feminino, que nas pranchas revisadas foi antecipada para as Etapas 04 e 05. Avaliar ganho de prazo.\",\"st\":\"aberto\",\"a\":\"\"}],\"focus\":[3.6,11.2]},{\"id\":\"e7\",\"code\":\"Etapa 07\",\"title\":\"Finalização do DML e conclusão do banheiro feminino\",\"start\":\"2026-12-04\",\"end\":\"2026-12-17\",\"days\":11,\"desc\":\"O DML recebe tanque, louças e metais. A bancada de granito com 5 cubas é assentada no WC feminino, que é liberado. Os homens voltam ao WC masculino.\",\"items\":[{\"n\":\"1\",\"t\":\"Execução das instalações do Depósito de Material de Limpeza (DML), seguida da liberação do espaço para utilização\",\"z\":\"st a Imbiribeira, térreo. Situação atual (R00, 02/10/2026) x proposta REV01 (06/10/2026). Sequência de obra proposta para validação.\",\"key\":\"fc-imb-sala-treinamentos-r00\",\"mark\":\"FC\"},\"steps\":[{\"id\":\"s0\",\"code\":\"Antes da obra\",\"title\":\"Situação atual do térreo\",\"start\":\"\",\"end\":\"\",\"days\":0,\"desc\":\"Situação atual conforme a Planta Térreo Situação Atual: bloco do RH com Equipe RH (16,70 m²), sala E.L. (6,14 m²) e Supervisora RH (4,65 m²); sala de 22,48 m² com 18 carteiras; sala de 11,39 m²; faixa de circulação com porta para a área externa; circulação principal de ponta a ponta, com quadro elétrico no fundo; sala de avaliação (44,98 m²) com porta externa; ambiente aberto ao lado do CPD 2.\",\"items\":[],\"zones\":{\"rh\":{\"label\":\"Equipe RH\",\"status\":\"uso\",\"who\":\"\"},\"el\":{\"label\":\"E.L.\",\"status\":\"uso\",\"who\":\"\"},\"sup\":{\"label\":\"Supervisora RH\",\"status\":\"uso\",\"who\":\"\"},\"rhc\":{\"label\":\"Circulação RH\",\"status\":\"uso\",\"who\":\"\"},\"s02\":{\"label\":\"Sala 22,48 m²\",\"status\":\"uso\",\"who\":\"18 carteiras\"},\"hallE\":{\"label\":\"Circulação\",\"status\":\"uso\",\"who\":\"Acesso pela porta externa da faixa\"},\"copa\":{\"label\":\"Apoio (pia)\",\"status\":\"uso\",\"who\":\"\"},\"s03\":{\"label\":\"Sala 11,39 m²\",\"status\":\"uso\",\"who\":\"\"},\"faixa\":{\"label\":\"\",\"status\":\"uso\",\"who\":\"\"},\"circ\":{\"label\":\"Circulação principal\",\"status\":\"uso\",\"who\":\"\"},\"hallD\":{\"label\":\"Ambiente aberto\",\"status\":\"uso\",\"who\":\"Sem mobiliário\"},\"cpd\":{\"label\":\"CPD 2\",\"status\":\"uso\",\"who\":\"\"},\"s04\":{\"label\":\"Sala de avaliação\",\"status\":\"uso\",\"who\":\"Acesso por porta externa\"},\"copa2\":{\"label\":\"\",\"status\":\"uso\",\"who\":\"Fim da circulação, quadro elétrico\"},\"acesso\":{\"label\":\"\",\"status\":\"uso\",\"who\":\"Área externa\"}},\"els\":{},\"decisions\":[{\"t\":\"Não há cronograma: a sequência das etapas foi proposta a partir das duas plantas e precisa ser validada, com datas definidas.\",\"st\":\"aberto\",\"a\":\"\"}]},{\"id\":\"s1\",\"code\":\"Etapa 01\",\"title\":\"Mobilização e desocupação do RH\",\"start\":\"\",\"end\":\"\",\"days\":0,\"desc\":\"O bloco do RH é desocupado: saem estações de trabalho, mesas, cadeiras, armário de 4 portas e arquivo. A circulação principal recebe tapume ao longo do trecho de parede que será demolido.\",\"items\":[{\"n\":\"1\",\"t\":\"Desmobilizar Equipe RH, E.L. e Supervisora RH e retirar todo o mobiliário\",\"z\":\"rh\"},{\"n\":\"2\",\"t\":\"Retirar armário de 4 portas e arquivo encostados na parede da circulação\",\"z\":\"hallE\"},{\"n\":\"3\",\"t\":\"Instalar tapume na circulação principal ao longo do trecho de parede a demolir\",\"z\":\"circ\"},{\"n\":\"4\",\"t\":\"Proteger piso, splits e esquadrias que permanecem\",\"z\":\"rh\"}],\"zones\":{\"rh\":{\"label\":\"Equipe RH\",\"status\":\"desat\",\"who\":\"Desocupada\"},\"el\":{\"label\":\"E.L.\",\"status\":\"desat\",\"who\":\"\"},\"sup\":{\"label\":\"Supervisora RH\",\"status\":\"desat\",\"who\":\"\"},\"rhc\":{\"label\":\"\",\"status\":\"desat\",\"who\":\"\"},\"circ\":{\"label\":\"Circulação principal\",\"status\":\"uso\",\"who\":\"Tapume em frente ao vão\"}},\"els\":{\"mob_rh\":\"demolir\",\"arm_rh\":\"demolir\",\"tap_circ\":\"novo\"},\"focus\":[-0.4,10.2],\"decisions\":[{\"t\":\"Para onde vão Equipe RH, E.L. e Supervisora RH durante e depois da obra?\",\"st\":\"aberto\",\"a\":\"\"},{\"t\":\"Destino do mobiliário retirado (reaproveitar, guardar ou descartar)?\",\"st\":\"aberto\",\"a\":\"\"}]},{\"id\":\"s2\",\"code\":\"Etapa 02\",\"title\":\"Demolições do RH e da parede entre hall e circulação\",\"start\":\"\",\"end\":\"\",\"days\":0,\"desc\":\"Saem as divisórias e portas da E.L., da Supervisora RH e da circulação do RH, unindo tudo no espaço da futura Sala 01. Na REV01 o trecho de 4,16 m da parede de alvenaria entre o hall e a circulação principal é demolido por inteiro, com o basculante, e o hall passa a ser integrado à circulação.\",\"items\":[{\"n\":\"1\",\"t\":\"Demolir divisórias e portas da E.L. e da Supervisora RH\",\"z\":\"el\"},{\"n\":\"2\",\"t\":\"Demolir divisória e porta entre Equipe RH e circulação do RH\",\"z\":\"rhc\"},{\"n\":\"3\",\"t\":\"Remover basculante 1,99 x 1,99 e demolir o trecho de 4,16 m da parede de alvenaria entre hall e circulação\",\"z\":\"hallE\"}],\"zones\":{\"rh\":{\"label\":\"Futura Sala 01\",\"status\":\"obra\",\"who\":\"\"},\"el\":{\"label\":\"\",\"status\":\"obra\",\"who\":\"\"},\"sup\":{\"label\":\"\",\"status\":\"obra\",\"who\":\"\"},\"rhc\":{\"label\":\"\",\"status\":\"obra\",\"who\":\"\"},\"hallE\":{\"label\":\"Novo hall\",\"status\":\"obra\",\"who\":\"Rota da Sala 02 passa por aqui\"}},\"els\":{\"div_el_esq\":\"demolir\",\"porta_el\":\"demolir\",\"div_el_dir\":\"demolir\",\"div_rh_fundo\":\"demolir\",\"div_rhc\":\"demolir\",\"porta_rh\":\"demolir\",\"peit816\":\"demolir\",\"jan816\":\"demolir\",\"p816_hall\":\"demolir\"},\"focus\":[-0.4,10.2],\"decisions\":[{\"t\":\"Demolição do trecho de 4,16 m da parede de alvenaria: confirmar se é só vedação e definir verga ou viga no topo do vão. A REV01 não mostra nada no lugar.\",\"st\":\"aberto\",\"a\":\"\"},{\"t\":\"A Sala 02 continua em uso? Hoje o acesso dela passa pelo trecho que vira frente de obra.\",\"st\":\"aberto\",\"a\":\"\"}]},{\"id\":\"s3\",\"code\":\"Etapa 03\",\"title\":\"Divisórias novas: Sala 01, Sala 02 e Laboratório\",\"start\":\"\",\"end\":\"\",\"days\":0,\"desc\":\"Divisória nova com porta fecha a Sala 01 em relação ao hall, com a porta no canto junto à circulação. A porta da Sala 02 muda de lugar: abre-se um vão novo no topo da divisória e a porta antiga, junto à parede de baixo, é fechada. A sala de 11,39 m² incorpora a faixa de circulação e vira o Laboratório (4,40 x 3,70 m): sai a divisória lateral, a porta antiga é fechada, entra divisória nova com porta no canto do hall e a porta externa da faixa é fechada.\",\"items\":[{\"n\":\"1\",\"t\":\"Executar divisória entre Sala 01 e hall com porta de 0,82 m no canto da circulação\",\"z\":\"rhc\"},{\"n\":\"2\",\"t\":\"Abrir vão novo no topo da divisória da Sala 02 e instalar porta de 0,82 m\",\"z\":\"s02\"},{\"n\":\"3\",\"t\":\"Retirar a porta atual da Sala 02 e fechar o vão\",\"z\":\"s02\"},{\"n\":\"4\",\"t\":\"Demolir divisória entre a sala de 11,39 m² e a faixa de circulação\",\"z\":\"faixa\"},{\"n\":\"5\",\"t\":\"Fechar a porta atual da sala de 11,39 m²\",\"z\":\"s03\"},{\"n\":\"6\",\"t\":\"Executar divisória nova no topo da faixa com porta de 0,85 m para o Laboratório\",\"z\":\"faixa\"},{\"n\":\"7\",\"t\":\"Fechar a porta externa da faixa (só depois do hall liberado)\",\"z\":\"faixa\"},{\"n\":\"8\",\"t\":\"Retirar o tapume da circulação principal\",\"z\":\"circ\"}],\"zones\":{\"hallE\":{\"label\":\"Novo hall\",\"status\":\"obra\",\"who\":\"\"},\"s02\":{\"label\":\"Sala 02\",\"status\":\"obra\",\"who\":\"Troca de porta\"},\"s03\":{\"label\":\"Futuro Laboratório\",\"status\":\"obra\",\"who\":\"\"},\"faixa\":{\"label\":\"\",\"status\":\"obra\",\"who\":\"\"},\"circ\":{\"label\":\"Circulação principal\",\"status\":\"uso\",\"who\":\"\"}},\"els\":{\"div_s01\":\"novo\",\"porta_s01\":\"novo\",\"vao_s02\":\"demolir\",\"porta_s02_old\":\"demolir\",\"porta_s02\":\"novo\",\"fech_s02_old\":\"novo\",\"div_s03\":\"demolir\",\"porta_s03_old\":\"demolir\",\"fech_s03_old\":\"novo\",\"div_s03_nova\":\"novo\",\"porta_s03\":\"novo\",\"porta_ext_faixa\":\"demolir\",\"fech_ext_faixa\":\"novo\",\"tap_circ\":\"oculto\"},\"focus\":[-0.4,10.2],\"decisions\":[{\"t\":\"A REV01 desenha a porta externa da faixa fechada. Confirmar o fechamento e a rota de saída de emergência das salas 01 e 02 e do Laboratório (49 pessoas) só pelo hall.\",\"st\":\"aberto\",\"a\":\"\"},{\"t\":\"As portas da Sala 01 e da Sala 02 ficam lado a lado no topo do hall. Confirmar sentido de abertura das duas (ambas abrem para dentro das salas).\",\"st\":\"aberto\",\"a\":\"\"}]},{\"id\":\"s4\",\"code\":\"Etapa 04\",\"title\":\"Sala 04 e Copa no fim da circulação\",\"start\":\"\",\"end\":\"\",\"days\":0,\"desc\":\"A sala de avaliação vira Sala 04: abre-se um vão de 0,86 m na parede da circulação principal, junto ao hall de entrada, e a porta externa da sala é fechada. O fim da circulação principal vira a Copa (1,50 x 3,83 m, 5,72 m²), com divisória nova e porta de 0,84 m na altura do hall e fechamento no fundo.\",\"items\":[{\"n\":\"1\",\"t\":\"Abrir vão e instalar porta da Sala 04 na parede da circulação principal\",\"z\":\"s04\"},{\"n\":\"2\",\"t\":\"Fechar a porta externa da Sala 04\",\"z\":\"s04\"},{\"n\":\"3\",\"t\":\"Executar divisória da Copa com porta de 0,84 m\",\"z\":\"copa2\"},{\"n\":\"4\",\"t\":\"Executar fechamento no fundo da Copa\",\"z\":\"copa2\"}],\"zones\":{\"s04\":{\"label\":\"Sala 04\",\"status\":\"obra\",\"who\":\"\"},\"hallD\":{\"label\":\"Hall de entrada\",\"status\":\"obra\",\"who\":\"\"},\"circ\":{\"label\":\"Circulação principal\",\"status\":\"uso\",\"who\":\"\"},\"copa2\":{\"label\":\"Copa\",\"status\":\"obra\",\"who\":\"\"}},\"els\":{\"vao_s04\":\"demolir\",\"porta_s04\":\"novo\",\"porta_ext_s04\":\"demolir\",\"fech_ext_s04\":\"novo\",\"fech_circ\":\"novo\",\"div_copa\":\"novo\",\"porta_copa_n\":\"novo\"},\"focus\":[7.6,16.2],\"decisions\":[{\"t\":\"O quadro elétrico existente fica dentro da Copa, atrás da bancada com pia desenhada na REV01. Remanejar o quadro ou ajustar a bancada?\",\"st\":\"aberto\",\"a\":\"\"},{\"t\":\"A Copa precisa de água e esgoto para a pia e hoje não há ponto no fim da circulação. Definir de onde vêm os dois.\",\"st\":\"aberto\",\"a\":\"\"},{\"t\":\"Fechamento no fundo da Copa sem especificação: parede, divisória ou esquadria?\",\"st\":\"aberto\",\"a\":\"\"},{\"t\":\"Sala 04 com 30 lugares fica com uma única porta de 0,86 m. Validar saída de emergência e sentido de abertura.\",\"st\":\"aberto\",\"a\":\"\"}]},{\"id\":\"s5\",\"code\":\"Etapa 05\",\"title\":\"Novo acesso com rampa\",\"start\":\"\",\"end\":\"\",\"days\":0,\"desc\":\"Novo acesso pelo topo da circulação principal: rampa de 2,55 m com inclinação de 7,84%, do nível +0,00 no estacionamento ao +0,20 do patamar, e porta de 0,92 m abrindo para fora no lugar da esquadria de vidro atual.\",\"focus\":[5.5,12.5],\"items\":[{\"n\":\"1\",\"t\":\"Isolar a frente do acesso com tapume\",\"z\":\"acesso\"},{\"n\":\"2\",\"t\":\"Executar rampa i = 7,84% e patamar no nível +0,20\",\"z\":\"acesso\"},{\"n\":\"3\",\"t\":\"Retirar a esquadria de vidro do topo da circulação\",\"z\":\"circ\"},{\"n\":\"4\",\"t\":\"Instalar porta de acesso de 0,92 m com fixo lateral e bandeira\",\"z\":\"circ\"}],\"zones\":{\"acesso\":{\"label\":\"Novo acesso\",\"status\":\"obra\",\"who\":\"\"},\"circ\":{\"label\":\"Circulação principal\",\"status\":\"uso\",\"who\":\"Topo fechado durante a troca da esquadria\"}},\"els\":{\"tap_acesso\":\"novo\",\"rampa\":\"novo\",\"vid_circ\":\"demolir\",\"porta_acesso\":\"novo\"},\"decisions\":[{\"t\":\"Corrimão, guarda-corpo e piso tátil da rampa não aparecem na REV01. Definir conforme NBR 9050.\",\"st\":\"aberto\",\"a\":\"\"},{\"t\":\"A rampa e quase todo o patamar ficam fora da projeção da cobertura. Haverá cobertura e drenagem no acesso?\",\"st\":\"aberto\",\"a\":\"\"},{\"t\":\"Esquadria do acesso: a REV01 desenha porta de 0,92 m e um trecho de 0,49 m ao lado. Confirmar se é fixo de vidro e o tipo de porta.\",\"st\":\"aberto\",\"a\":\"\"}]},{\"id\":\"s6\",\"code\":\"Etapa 06\",\"title\":\"Instalações e acabamentos\",\"start\":\"\",\"end\":\"\",\"days\":0,\"desc\":\"Recomposição de piso, forro e pintura nas faixas das paredes e divisórias demolidas e dos vãos abertos ou fechados. Instalação hidráulica e da bancada da Copa, elétrica e dados das 6 estações do Laboratório e revisão de iluminação, tomadas e climatização. As carteiras atuais da Sala 02 saem para o novo arranjo. A prancha avisa que luminárias e climatização são ilustrativas.\",\"items\":[{\"n\":\"\",\"t\":\"Recompor piso e forro onde saíram paredes e divisórias, incluindo a faixa entre hall e circulação\",\"z\":\"hallE\"},{\"n\":\"\",\"t\":\"Água, esgoto, bancada e pia da Copa\",\"z\":\"copa2\"},{\"n\":\"\",\"t\":\"Tomadas e rede de dados das 6 estações do Laboratório\",\"z\":\"s03\"},{\"n\":\"\",\"t\":\"Retirar as 18 carteiras atuais da Sala 02\",\"z\":\"s02\"},{\"n\":\"\",\"t\":\"Pintura das salas, do Laboratório, da Copa e dos halls\",\"z\":\"rh\"},{\"n\":\"\",\"t\":\"Revisar iluminação, tomadas e climatização\",\"z\":\"s04\"},{\"n\":\"\",\"t\":\"Retirar o tapume do acesso\",\"z\":\"acesso\"}],\"zones\":{\"rh\":{\"label\":\"Sala 01\",\"status\":\"obra\",\"who\":\"\"},\"hallE\":{\"label\":\"Novo hall\",\"status\":\"obra\",\"who\":\"\"},\"s02\":{\"label\":\"Sala 02\",\"status\":\"obra\",\"who\":\"\"},\"s03\":{\"label\":\"Laboratório\",\"status\":\"obra\",\"who\":\"\"},\"faixa\":{\"label\":\"\",\"status\":\"obra\",\"who\":\"\"},\"s04\":{\"label\":\"Sala 04\",\"status\":\"obra\",\"who\":\"\"},\"hallD\":{\"label\":\"Hall de entrada\",\"status\":\"obra\",\"who\":\"\"},\"copa2\":{\"label\":\"Copa\",\"status\":\"obra\",\"who\":\"\"},\"acesso\":{\"label\":\"Novo acesso\",\"status\":\"entregue\",\"who\":\"\"}},\"els\":{\"fx_copa\":\"novo\",\"mob_s02\":\"demolir\",\"tap_acesso\":\"oculto\"},\"decisions\":[{\"t\":\"Haverá projeto de elétrica, dados e climatização? Splits atuais atendem 24 lugares na Sala 01, 19 na Sala 02, o Laboratório com 6 computadores e 30 lugares na Sala 04?\",\"st\":\"aberto\",\"a\":\"\"},{\"t\":\"Definir especificação de acabamentos (piso, pintura, forro), inclusive o encontro de piso entre hall e circulação, que têm pé-direito diferente (3,05 x 3,14 m).\",\"st\":\"aberto\",\"a\":\"\"}]},{\"id\":\"s7\",\"code\":\"Etapa 07\",\"title\":\"Mobiliário e ambientação\",\"start\":\"\",\"end\":\"\",\"days\":0,\"desc\":\"Montagem do mobiliário da REV01: carteiras e birôs das salas 01 e 04, novo arranjo da Sala 02 com 19 carteiras, ilha com 6 estações no Laboratório, armário baixo na Sala 04, sofá, planta e bebedouro no hall das salas e sofás, pla     '<th>Projeto</th><th>Tipo</th><th>Planejamento</th><th class="r">Passos</th><th class="r">Em aberto</th><th>Período</th><th></th></tr></thead><tbody>'+

      '<td class="r"><button class="btn pr" data-open="'+p.id+'">'+IC.cube+'Abrir 4D</button></td></tr>';}).join('')+
    '</tbody></table></div></section>';

function docFor(p){return p.html.replace(/<head>/i,'<head>\n<script>'+SHIM.replace('__ID__',p.id)+'<\/script>');}
function ensureFrame(p,reload){
  var f=frames[p.id];
  if(f&&!reload)return f;
  if(f){f.remove();delete frames[p.id];}
  f=document.createElement('iframe');f.title='4D: '+p.title;$('#stage').appendChild(f);frames[p.id]=f;
  f.dataset.ready='0';
  f.onload=function(){f.dataset.ready='1';injectPrintBtn(p,f);if(st.view===p.id)$('#loading').hidden=true;};
  f.srcdoc=docFor(p);
  return f;
}

function show(){
  app.classList.toggle('collapsed',st.collapsed);
  app.classList.toggle('presenting',st.presenting&&st.view!=='overview');
  var r=renderSide();
  var ov=st.view==='overview';
  $('#over').hidden=!ov;
  Object.keys(frames).forEach(function(k){frames[k].classList.toggle('on',k===st.view);});
  if(ov){renderOver(r);$('#loading').hidden=true;document.title='Portfólio 4D | Ferreira Costa';}
  else{
    var p=byId[st.view],f=ensureFrame(p);
    f.classList.add('on');
    $('#ldt').textContent=p.title;
    $('#loading').hidden=f.dataset.ready==='1';
    document.title=p.title+' | Portfólio 4D';
  }
}
function open(id,pi,si){
  if(id!=='overview'&&!byId[id])return;
  var p=byId[id];
  if(p&&si!=null&&si>=0){
    if(p.propKey&&pi>=0)SS.set(p.propKey,String(pi));
    SS.set(p.stepKey,String(si));
    if(frames[id])ensureFrame(p,true);
  }
  if(st.view!==id)st.presenting=false;
  st.view=id;LS.set('fc-hub-view',id);
  if(mqM.matches)st.collapsed=true;
  show();
}

}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
/* captura o 3D como está na tela, com etiquetas e marcadores do escopo */
function snap(p){
  return new Promise(function(res){
    var f=frames[p.id],d=f.contentDocument,w=f.contentWindow,view=d.getElementById('view'),cv=view&&view.querySelector('canvas');
    if(!cv||!cv.width){res(null);return;}
    w.requestAnimationFrame(function(){
      try{
        var vr=view.getBoundingClientRect(),k=cv.width/Math.max(1,vr.width),x0=0;
        var info=d.getElementById('info');
        if(info&&info.offsetWidth&&!info.classList.contains('min')){var ir=info.getBoundingClientRect();if(ir.right-vr.left<vr.width*0.6)x0=Math.round(ir.right-vr.left+6);}
        var cw=Math.round((vr.width-x0)*k),ch=cv.height,out=document.createElement('canvas');out.width=cw;out.height=ch;
        var c=out.getContext('2d');c.drawImage(cv,Math.round(x0*k),0,cw,ch,0,0,cw,ch);
        var gs=w.getComputedStyle(d.documentElement),tagBg=gs.getPropertyValue('--tag').trim()||'#fff',tagInk=gs.getPropertyValue('--tag-ink').trim()||'#1C252D';
        d.querySelectorAll('#layer .tag').forEach(function(t){
          var cs=w.getComputedStyle(t);if(cs.display==='none'||cs.visibility==='hidden')return;
          var r=t.getBoundingClientRect(),x=(r.left-vr.left-x0)*k,y=(r.top-vr.top)*k,tw=r.width*k,th=r.height*k;
          if(x+tw<0||x>cw||y+th<0||y>ch)return;
          c.save();c.shadowColor='rgba(0,0,0,.18)';c.shadowBlur=3*k;rr(c,x,y,tw,th,7*k);c.fillStyle=tagBg;c.fill();c.restore();
          var b=t.querySelector('b'),i=t.querySelector('i'),sp=t.querySelector('.st');
          if(i){var ir2=i.getBoundingClientRect();c.fillStyle=w.getComputedStyle(i).backgroundColor;c.beginPath();c.arc((ir2.left-vr.left-x0+ir2.width/2)*k,(ir2.top-vr.top+ir2.height/2)*k,ir2.width/2*k,0,7);c.fill();}
          c.fillStyle=tagInk;c.textBaseline='alphabetic';
          if(b){var br=b.getBoundingClientRect(),tx=b.textContent;c.font='600 '+(14*k)+'px "Barlow Condensed", Arial, sans-serif';c.fillText(tx,(br.left-vr.left-x0+(i?i.getBoundingClientRect().width+6:0))*k,(br.bottom-vr.top-3.5)*k);}
          if(sp){var sr=sp.getBoundingClientRect();c.globalAlpha=.75;c.font='400 '+(12.5*k)+'px "Barlow", Arial, sans-serif';c.fillText(sp.textContent,(sr.left-vr.left-x0)*k,(sr.bottom-vr.top-3)*k);c.globalAlpha=1;}
        });
        d.querySelectorAll('#layer .pin').forEach(function(t){
          var cs=w.getComputedStyle(t);if(cs.display==='none'||cs.visibility==='hidden')return;
          var r=t.getBoundingClientRect(),x=(r.left-vr.left-x0)*k,y=(r.top-vr.top)*k,tw=r.width*k,th=r.height*k;
          if(x+tw<0||x>cw||y+th<0||y>ch)return;
          rr(c,x-2*k,y-2*k,tw+4*k,th+4*k,(th+4*k)/2);c.fillStyle='#fff';c.fill();
          rr(c,x,y,tw,th,th/2);c.fillStyle='#D7192A';c.fill();
          if(t.textContent){c.fillStyle='#fff';c.font='700 '+(13*k)+'px "Barlow Condensed", Arial, sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(t.textContent,x+tw/2,y+th/2+k);c.textAlign='left';}
        });
        var cr=autoCrop(out);
        res({url:cr.toDataURL('image/jpeg',0.93),ratio:cr.width/cr.height});
      }catch(e){res(null);}
    });
  });
}
function autoCrop(cv){
  try{
    var w=cv.width,h=cv.height,c=cv.getContext('2d'),dd=c.getImageData(0,0,w,h).data;
    var px=function(x,y){var i=(y*w+x)*4;return [dd[i],dd[i+1],dd[i+2]];};
    var bgs=[px(2,2),px(w-3,2),px(2,h-3),px(w-3,h-3),px(Math.floor(w/2),2)];
    var far=function(r,g,b){for(var k=0;k<bgs.length;k++){var q=bgs[k];if(Math.abs(r-q[0])+Math.abs(g-q[1])+Math.abs(b-q[2])<70)return false;}return true;};
    var st=Math.max(1,Math.floor(Math.min(w,h)/500)),x0=w,y0=h,x1=-1,y1=-1;
    for(var y=0;y<h;y+=st){for(var x=0;x<w;x+=st){var i=(y*w+x)*4;if(far(dd[i],dd[i+1],dd[i+2])){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}}}
    if(x1<0||(x1-x0)<w*0.08||(y1-y0)<h*0.08)return cv;
    var m=Math.round(Math.max(x1-x0,y1-y0)*0.04);
    x0=Math.max(0,x0-m);y0=Math.max(0,y0-m);x1=Math.min(w,x1+m);y1=Math.min(h,y1+m);
    var o=document.createElement('canvas');o.width=x1-x0;o.height=y1-y0;o.getContext('2d').drawImage(cv,x0,y0,o.width,o.height,0,0,o.width,o.height);
    var oc=o.getContext('2d');oc.globalCompositeOperation='destination-over';oc.fillStyle='rgb('+bgs[0].join(',')+')';oc.fillRect(0,0,o.width,o.height);
    return o;
  }catch(e){return cv;}
}

   '<div class="a3-st"><div class="c">'+esc(s.code||'')+'</div><div class="d">'+esc(dText(s))+'<br>Passo '+(ctx.cur+1)+' de '+n+'</div></div></div>'+
   '<div class="a3-b"><div class="a3-v"><div class="a3-img"'+(wide?' style="height:'+ih+'px;flex:none"':'')+'>'+(img?'<img alt="" src="'+img+'">':'<div class="none">Modelo 3D indisponível neste navegador</div>')+'</div>'+
   '<div class="a3-lg"><span><i style="background:#E3E7EA"></i>Existente</span><span><i style="background:#F2C230"></i>Demolir ou remover</span><span><i style="background:#D9363E"></i>Construir ou instalar</span><span><i style="background:#E8862E;opacity:.7"></i>Tapume</span><span class="sep"></span>'+
     Object.keys(STC).map(function(k){return '<span><i class="o" style="background:'+STC[k][0]+'"></i>'+STC[k][1]+'</span>';}).join('')+'</div></div>'+
   '<div class="a3-p"><div class="sc"><div class="k">'+esc(s.code||'')+'</div><h2>'+esc(s.title||'')+'</h2>'+(s.desc?'<p class="ds">'+esc(s.desc)+'</p>':'')+
   '<h3>Escopo</h3>'+((s.items||[]).length?'<ol>'+s.items.map(function(it){return '<li class="it"><span class="n'+(it.n?'':' dot')+'">'+esc(it.n||'')+'</span><span>'+esc(it.t)+'</span></li>';}).join('')+'</ol>':'<p class="none">Sem itens de escopo neste passo.</p>')+'</div>'+
   (zk.length?'<div class="sc"><h3>Uso dos espaços</h3><ul>'+zk.map(function(k){var v=zs[k],c=STC[v.status]||STC.uso;return '<li class="zn"><i style="background:'+c[0]+'"></i><span><b>'+esc(v.label)+'</b> <span>'+c[1]+(v.who?', '+esc(v.who):'')+'</span></span></li>';}).join('')+'</ul></div>':'')+
   ((s.decisions||[]).length?'<div class="sc"><h3>Pontos para decidir</h3>'+s.decisions.map(function(x){var ok=x.st==='decidido';return '<div class="dc'+(ok?' ok':'')+'"><small>'+(ok?'Decidido':'Em aberto')+'</small>'+esc(x.t)+(ok&&x.a?'<br><b>Decisão:</b> '+esc(x.a):'')+'</div>';}).join('')+'</div>':'')+
   '</div></div>'+
   '<div class="a3-f"><div class="a3-sq">'+ctx.steps.map(function(x,i){return '<span class="'+(i===ctx.cur?'cur':(i<ctx.cur?'done':''))+'">'+esc(x.code||('Passo '+(i+1)))+'</span>';}).join('')+'</div>'+
   '<div class="a3-ft"><b>Portfólio 4D, Ferreira Costa</b><br>Planejamento de Obras, emitido em '+pad(now.getDate())+'/'+pad(now.getMonth()+1)+'/'+now.getFullYear()+' '+pad(now.getHours())+':'+pad(now.getMinutes())+'<br>Formato A3 paisagem</div>'+
   (ctx.qr?'<div class="a3-qr"><div class="qt"><b>Abrir este passo no 4D</b>Escaneie com a câmera do celular para ver o passo a passo interativo.</div><img alt="QR code do passo" src="'+ctx.qr+'"></div>':'')+'</div>'+
  '</div>';
  return h;
}
function fitSheet(root){var pnl=root.querySelector('.a3-p');if(!pnl)return;var wide=!!root.querySelector('.a3.wide'),fz=15,img=root.querySelector('.a3-img');
  var over=function(){if(!wide)return pnl.scrollHeight>pnl.clientHeight+1;var o=false;pnl.querySelectorAll('.sc').forEach(function(c){if(c.scrollHeight>c.clientHeight+1)o=true;});return o;};
  var shrink=function(min){fz=15;pnl.style.setProperty('--fz',fz+'px');while(over()&&fz>min){fz-=0.5;pnl.style.setProperty('--fz',fz+'px');}};
  if(!wide){shrink(10);return;}
  var h=parseInt(img&&img.style.height,10)||0;
  for(;;){shrink(12);if(!over()||!img||h<=320)break;h=Math.max(320,h-40);img.style.height=h+'px';}
  if(over())shrink(9.5);}
var pv=document.createElement('div');pv.className='pv';pv.id='pv';pv.hidden=true;pv.setAttribute('role','dialog');pv.setAttribute('aria-label','Impressão A3 do passo');
pv.innerHTML='<div class="pv-bar"><div class="t"><b id="pvT">Impressão A3</b><small>Folha A3 paisagem com a vista 3D atual. Para outro enquadramento, feche, ajuste a vista e abra de novo.</small></div>'+
  '<button class="btn pr" id="pvPdf">'+PRINT_IC.replace('<svg','<svg aria-hidden="true"')+'Baixar PDF A3</button><button class="btn" id="pvLink">Link do QR</button><button class="btn" id="pvPrint">Imprimir</button><button class="btn" id="pvClose">Fechar</button></div>'+
  '<div class="pv-lk" id="pvLk" hidden><label for="pvUrl"><b>Link que o QR abre no navegador</b>Cole aqui o link público do portfólio (Compartilhar, qualquer pessoa com o link). O QR acrescenta o projeto e o passo no final.</label>'+
  '<div class="r"><input id="pvUrl" type="url" inputmode="url" spellcheck="false" placeholder="https://..."><button class="btn pr" id="pvUrlOk">Aplicar</button><button class="btn" id="pvUrlCancel">Cancelar</button></div><small id="pvUrlMsg"></small></div>'+
  '<div class="pv-stage" id="pvStage"><div class="pv-scale" id="pvScale"></div></div><div id="pvHold"></div>';
document.body.appendChild(pv);
var pvCur=null;
function pvFit(){var sc=$('#pvScale'),a=sc.firstElementChild;if(!a)return;var st=$('#pvStage'),s=Math.min((st.clientWidth-36)/1587,(st.clientHeight-36)/1122,1);s=Math.max(0.15,s);
  a.style.transform='scale('+s+')';a.style.transformOrigin='0 0';sc.style.width=Math.round(1587*s)+'px';sc.style.height=Math.round(1122*s)+'px';}
function openPrint(id){
  var p=byId[id];if(!p||!frames[id])return;
  var ctx=curOf(p);
  Promise.all([snap(p),loadLib(LIB_QR).catch(function(){})]).then(function(r){var img=r[0];
    ctx.qr=qrImg(stepLink(p,ctx));
    pvCur={p:p,ctx:ctx,img:img};
    var s=ctx.steps[ctx.cur]||{};
    $('#pvT').textContent='Imprimir A3: '+(s.code||'')+(s.title?', '+s.title:'');
    $('#pvScale').innerHTML=sheetHTML(p,ctx,img);
    pv.hidden=false;
    var go=function(){fitSheet($('#pvScale'));pvFit();};
    if(document.fonts&&document.fonts.ready)document.fonts.ready.then(go);else go();
    var im=$('#pvScale img');if(im&&!im.complete)im.onload=go;
    $('#pvPdf').focus();
  });
}
function closePrint(){pv.hidden=true;$('#pvScale').innerHTML='';pvCur=null;}
function loadLib(src){return new Promise(function(res,rej){var e=document.querySelector('script[src="'+src+'"]');if(e){if(e.dataset.ok)res();else{e.addEventListener('load',res);e.addEventListener('error',rej);}return;}
  var s=document.createElement('script');s.src=src;s.onload=function(){s.dataset.ok='1';res();};s.onerror=rej;document.head.appendChild(s);});}
var dlP=null;
function dlCap(){if(!dlP){try{dlP=(window.claude&&typeof window.claude.use==='function')?window.claude.use('downloads'):Promise.resolve(null);}catch(e){dlP=Promise.resolve(null);}}return dlP;}
function fileName(){var s=pvCur.ctx.steps[pvCur.ctx.cur]||{};return ((pvCur.p.title+' - '+(s.code||'passo')+' - A3').replace(/[\\/:*?"<>|]+/g,'').replace(/\s+/g,' ').trim()||'passo-A3')+'.pdf';}
function busy(on,txt){var b=$('#pvPdf');b.classList.toggle('pv-busy',on);b.lastChild.textContent=txt;}
$('#pvPdf').addEventListener('click',function(){
  if(!pvCur)return;
  busy(true,'Gerando PDF...');
  var hold=$('#pvHold');
  Promise.all([loadLib(LIB_H2C),loadLib(LIB_PDF),document.fonts?document.fonts.ready:Promise.resolve()]).then(function(){
    hold.innerHTML=sheetHTML(pvCur.p,pvCur.ctx,pvCur.img);fitSheet(hold);
    var el=hold.firstElementChild,im=el.querySelector('img');
    return new Promise(function(r){if(!im||im.complete)r();else{im.onload=r;im.onerror=r;}}).then(function(){
      return window.html2canvas(el,{scale:2,backgroundColor:'#ffffff',logging:false,width:1587,height:1122,windowWidth:1700,windowHeight:1200});
    });
  }).then(function(cnv){
    hold.innerHTML='';
    var pdf=new window.jspdf.jsPDF({orientation:'landscape',unit:'mm',format:'a3',compress:true});
    pdf.addImage(cnv.toDataURL('image/jpeg',0.92),'JPEG',0,0,420,297);
    var blob=pdf.output('blob'),name=fileName();
    return dlCap().then(function(dl){
      if(dl)return dl.save({filename:name,data:blob}).then(function(){busy(false,'PDF salvo');setTimeout(function(){busy(false,'Baixar PDF A3');},2500);},function(err){busy(false,err&&err.code==='declined'?'Baixar PDF A3':'Não foi possível salvar');if(err&&err.code!=='declined')setTimeout(function(){busy(false,'Baixar PDF A3');},3000);});
      var u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},4000);
      busy(false,'Baixar PDF A3');
    });
  }).catch(function(){hold.innerHTML='';busy(false,'Falha ao gerar, tente de novo');setTimeout(function(){busy(false,'Baixar PDF A3');},3000);});
});
$('#pvPrint').addEventListener('click',function(){if(!pvCur)return;try{window.print();}catch(e){}});
$('#pvClose').addEventListener('click',closePrint);
function regenQR(){if(!pvCur)return;pvCur.ctx.qr=qrImg(stepLink(pvCur.p,pvCur.ctx));$('#pvScale').innerHTML=sheetHTML(pvCur.p,pvCur.ctx,pvCur.img);fitSheet($('#pvScale'));pvFit();}
$('#pvLink').addEventListener('click',function(){var lk=$('#pvLk');lk.hidden=!lk.hidden;if(!lk.hidden){$('#pvUrl').value=qrBase();$('#pvUrlMsg').textContent='';$('#pvUrl').focus();}pvFit();});
$('#pvUrlCancel').addEventListener('click',function(){$('#pvLk').hidden=true;pvFit();});
$('#pvUrlOk').addEventListener('click',function(){
  var v=$('#pvUrl').value.trim().split('#')[0],msg=$('#pvUrlMsg');
  if(!/^https?:\/\/\S+$/i.test(v)){msg.textContent='Informe um link completo, começando com https://';return;}
  LS.set('fc-hub-qr',v);regenQR();
  if(v===D.url){msg.textContent='Link aplicado.';return;}
  hubArt().then(function(a){
    if(!a){msg.textContent='Link aplicado neste navegador. Para gravar no portfólio, abra o link publicado.';return;}
    var old=D.url;D.url=v;msg.textContent='Gravando o link no portfólio, a página vai recarregar...';
    var c=pvCur.ctx,p=pvCur.p;
    SS.set('fc-hub-view',p.id);SS.set(p.stepKey,String(c.cur));if(c.pi>=0&&p.propKey)SS.set(p.propKey,String(c.pi));SS.set('fc-hub-reprint',p.id);
    a.publish(buildDoc()).then(function(){try{localStorage.removeItem('fc-hub-qr');}catch(e){}},function(){D.url=old;SS.del('fc-hub-reprint');msg.textContent='Link aplicado neste navegador. Não foi possível gravar no portfólio agora.';});
  });
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!pv.hidden)closePrint();});
window.addEventListener('resize',function(){if(!pv.hidden)pvFit();});

renderFilters();
show();
})();
</script>
