<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reforma dos sanitários do mezanino | 4D</title>
<style>
  html,body{margin:0;height:100%;background:#EEF1F3;color:#1C252D;font:15px/1.45 system-ui,"Segoe UI",Roboto,Arial,sans-serif}
  @media (prefers-color-scheme:dark){html,body{background:#141A1F;color:#E7ECF0}}
  .ld{height:100%;display:grid;place-items:center;text-align:center;padding:0 16px}
  .ld b{display:block;font-size:20px;margin-bottom:6px}
  .ld a{color:#D7192A}
</style>
</head>
<body>
<div class="ld" id="ld"><div><b>Reforma dos sanitários do mezanino</b><span id="msg">Carregando o modelo 3D…</span></div></div>
<script>
/* Abre só o visualizador 4D do projeto "mez", lendo o HTML embutido no portfólio. */
(function(){
  var PROJ='mez';
  var SHIM='<script>try{Object.defineProperty(window,"claude",{configurable:true,value:{use:function(){return Promise.resolve(null);}}});}catch(e){}<\/script>';
  /* modo QR: só o 3D, o cartão do passo e a navegação Voltar/Avançar */
  var CSS='<style id="qr-css">'+
    'header.top,aside.steps,aside#detail,footer.tl,.vtools,#layerbar,#layerleg{display:none!important}'+
    '#root{grid-template-rows:minmax(0,1fr)!important;height:100dvh!important}'+
    'main.work{grid-template-columns:minmax(0,1fr)!important;grid-template-rows:minmax(0,1fr)!important;height:100%!important}'+
    '.center{height:100%!important}'+
    '#qrFs{position:absolute;top:12px;right:12px;z-index:30;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:8px;border:0;background:#D7192A;color:#fff;font:600 14px/1 system-ui,"Segoe UI",Roboto,Arial,sans-serif;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25)}'+
    '#qrFs:hover{background:#A8111F}#qrFs svg{width:18px;height:18px}'+
    '</style>';
  var JS='<script>(function(){'+
    'var de=document.documentElement,req=de.requestFullscreen||de.webkitRequestFullscreen;'+
    'var fsEl=function(){return document.fullscreenElement||document.webkitFullscreenElement;};'+
    'var ex=document.exitFullscreen||document.webkitExitFullscreen;'+
    'var ICO_ON=\'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>\';'+
    'var ICO_OFF=\'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>\';'+
    'function init(){var v=document.getElementById("view");if(!v||!req)return;'+
      'var b=document.createElement("button");b.id="qrFs";b.type="button";v.appendChild(b);'+
      'var paint=function(){b.innerHTML=fsEl()?ICO_OFF+"Sair da tela cheia":ICO_ON+"Tela cheia";};paint();'+
      'b.onclick=function(){if(fsEl())ex.call(document);else req.call(de);};'+
      'document.addEventListener("fullscreenchange",paint);document.addEventListener("webkitfullscreenchange",paint);}'+
    'if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);else init();'+
    /* bloqueia atalhos de teclado do editor; setas continuam navegando */
    'document.addEventListener("keydown",function(e){if(!/^(Arrow|Escape|Tab)/.test(e.key))e.stopImmediatePropagation();},true);'+
    '})();<\/script>';
  function fail(){
    document.getElementById('msg').innerHTML='Não foi possível carregar. <a href="fc-portfolio-4d.html#p='+PROJ+'">Abrir pelo portfólio</a>';
  }
  fetch('fc-portfolio-4d.html',{cache:'no-cache'}).then(function(r){return r.text();}).then(function(t){
    var doc=new DOMParser().parseFromString(t,'text/html');
    var D=JSON.parse(doc.getElementById('hub-data').textContent);
    var p=D.projects.filter(function(x){return x.id===PROJ;})[0];
    if(!p||!p.html)return fail();
    var html=p.html.replace(/<head>/i,'<head>\n'+SHIM).replace(/<\/head>/i,CSS+'\n</head>').replace(/<\/body>(?![\s\S]*<\/body>)/i,JS+'\n</body>');
    if(html.indexOf('id="qrFs"')<0&&html.indexOf('"qrFs"')<0)html+=JS;
    document.open();document.write(html);document.close();
  }).catch(fail);
})();
</script>
</body>
</html>
